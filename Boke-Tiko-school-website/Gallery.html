<!-- ... rest of gallery content (grid of images) ... -->

<script>
    // Lightbox for Gallery
    let currentImageIndex = 0;
    const images = [school-logo.jpg];

    function openLightbox(index) {
        currentImageIndex = index;
        const lightbox = document.createElement('div');
        lightbox.id = 'lightbox';
        lightbox.className = 'fixed inset-0 bg-black bg-opacity-90 flex items-center justify-center z-[100]';
        lightbox.innerHTML = `
            <div class="relative max-w-4xl mx-auto p-4">
                <button onclick="closeLightbox()" class="absolute -top-4 -right-4 bg-white text-black p-3 rounded-full shadow"><i class="fas fa-times"></i></button>
                <img id="lightboxImage" src="${images[index]}" class="max-h-[85vh] rounded-2xl shadow-2xl" alt="School Photo">
                <div class="flex justify-between mt-6 text-white">
                    <button onclick="prevImage()" class="bg-emerald-700 px-6 py-3 rounded-full"><i class="fas fa-chevron-left"></i></button>
                    <button onclick="nextImage()" class="bg-emerald-700 px-6 py-3 rounded-full"><i class="fas fa-chevron-right"></i></button>
                </div>
            </div>
        `;
        document.body.appendChild(lightbox);
        document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
        const lb = document.getElementById('lightbox');
        if (lb) lb.remove();
        document.body.style.overflow = 'visible';
    }

    function prevImage() {
        currentImageIndex = (currentImageIndex - 1 + images.length) % images.length;
        document.getElementById('lightboxImage').src = images[currentImageIndex];
    }

    function nextImage() {
        currentImageIndex = (currentImageIndex + 1) % images.length;
        document.getElementById('lightboxImage').src = images[currentImageIndex];
    }

    // Attach click to all gallery images
    window.addEventListener('load', () => {
        document.querySelectorAll('#galleryGrid img').forEach((img, index) => {
            images.push(img.src);
            img.style.cursor = 'pointer';
            img.addEventListener('click', () => openLightbox(index));
        });
    });
</script>
